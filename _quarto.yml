# This file controls the settings for your Quarto template from www.marvinschmitt.com

# website settings
website:
  title: "Eva Loaeza Albino"          # Your name
  description: "Mexicana"  # A brief slogan (optional)
  image: img/my_image.jpg
  
  favicon: img/favicon.png
  
  # start of the navigation bar at the top of the website
  navbar:
    pinned: false
    #logo: /img/logo.png
    
    # your sub-pages
    left:
      - text: "Research"
        href: research/index.qmd
      - text: "CV"
        href: cv/index.qmd
    
    # your social media handles
    right:
      - icon: folder-symlink
        href: https://www.evaloaeza.com/
      - icon: twitter
        href: https://twitter.com/evadavinia
      - icon: linkedin
        href: https://www.linkedin.com/in/evaloaezaalbino/
      - icon: envelope
        aria-label: email
        href: "mailto:mail.eva.loaeza.albino@gmail.com"  
  
  

# Don't touch unless you know what you are doing :) ------------
  search: 
    location: navbar
    type: textbox
  page-footer: 
    left: |
      <span class="faux-block">&#169; 2024 Eva Loaeza Albino CC BY-SA 4.0</span>

project:
  type: website
  output-dir: docs

  preview: 
    port: 22222
    browser: true
    watch-inputs: true
    navigate: true

execute:
  freeze: true

format:
  html:
    fontsize: 1.1m
    theme: 
      - cosmo # cosmo/lumen
      - html/styles.scss
    toc: false
    code-link: true
    anchor-sections: true
    fig-cap-location: margin
    reference-location: margin
    footnotes-hover: true